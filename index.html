<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Images/Game-Controller.svg" />
    <script src="script.js" defer></script>
    <title>Random Game Selector</title>
  </head>
  <body>
    <header>
      <h1>Random Game Selector</h1>
      <!-- <button class="btn-list-chooser">Music</button>
      <button class="btn-list-chooser">Gaming</button>
      <button class="btn-list-chooser">Cooking</button> -->
    </header>
    <main>
      <!-- Hero Info -->
      <section>
        <div>
          <h2>Find out what to play today!</h2>
          <p>
            The Random Game Selector is described well by it's name. With a
            click on the button below. A random game will be displayed and
            suggested to you to try out.
          </p>
        </div>
      </section>
      <!-- Randomizer Area -->
      <section>
        <div id="game-card">
          <h2 class="title">No game chosen yet.</h2>
        </div>
        <button id="game-chooser">Choose Game</button>
      </section>
    </main>
    <!-- Footer -->
    <footer>
      <h4>This is a footer.</h4>
      <p>Wow! It's a footer.</p>
    </footer>
  </body>
</html>
